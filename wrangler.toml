name = "qqbot"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["webcrypto_modern_algorithms"]

[vars]
GIT_COMMIT_SHA = "unknown"
DEPLOYED_AT = "unknown"

[[durable_objects.bindings]]
name = "GROUP_GUARD"
class_name = "GroupGuard"

[[durable_objects.bindings]]
name = "GLOBAL_BUDGET"
class_name = "GlobalBudget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GroupGuard", "GlobalBudget"]

[observability.logs]
enabled = true
invocation_logs = true
